name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout authority
        shell: bash
        env:
          HMS_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$HMS_EXPECTED_SHA" ]; then
            echo "checkout authority mismatch: actual=$actual expected=$HMS_EXPECTED_SHA" >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
            echo "checkout is not clean" >&2
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest
      - name: Compile
        run: python -m compileall -q src tests scripts

  windows-test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout authority
        shell: pwsh
        env:
          HMS_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (& git rev-parse HEAD | Out-String).Trim().ToLowerInvariant()
          $expected = ([string]$env:HMS_EXPECTED_SHA).Trim().ToLowerInvariant()
          if ($actual -ne $expected) { throw "checkout authority mismatch: actual=$actual expected=$expected" }
          $dirty = (& git status --porcelain=v1 --untracked-files=all | Out-String).Trim()
          if ($dirty) { throw 'checkout is not clean' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        shell: pwsh
        run: python -m pip install -e '.[dev]'
      - name: Test including native DPAPI round-trip
        shell: pwsh
        run: pytest
      - name: Compile
        shell: pwsh
        run: python -m compileall -q src tests scripts

  windows-package:
    runs-on: windows-latest
    needs: [linux-test, windows-test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout authority
        shell: pwsh
        env:
          HMS_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (& git rev-parse HEAD | Out-String).Trim().ToLowerInvariant()
          $expected = ([string]$env:HMS_EXPECTED_SHA).Trim().ToLowerInvariant()
          if ($actual -ne $expected) { throw "checkout authority mismatch: actual=$actual expected=$expected" }
          $dirty = (& git status --porcelain=v1 --untracked-files=all | Out-String).Trim()
          if ($dirty) { throw 'checkout is not clean' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install pinned package toolchain
        shell: pwsh
        run: python -m pip install -e '.[package]'
      - name: Build onedir Windows x64 Agent
        shell: pwsh
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --console
          --name hms-agent
          --paths src
          --collect-submodules hms_gpt_vps
          scripts/hms_agent_entry.py
      - name: Smoke packaged executable version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (& .\dist\hms-agent\hms-agent.exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Packaged hms-agent.exe --version failed' }
          $expected = (python -c "import hms_gpt_vps; print('hms-agent ' + hms_gpt_vps.__version__)" | Out-String).Trim()
          if ($actual -ne $expected) {
            throw "Packaged Agent version mismatch: actual=$actual expected=$expected"
          }
      - name: Attest complete onedir package tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path .\dist\package -Force | Out-Null
          Copy-Item -LiteralPath .\dist\hms-agent -Destination .\dist\package\hms-agent -Recurse
          python .\scripts\attest_agent_package.py .\dist\package\hms-agent .\dist\package\hms-agent.manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Agent onedir package attestation failed' }

          $manifest = Get-Content -LiteralPath .\dist\package\hms-agent.manifest.json -Raw | ConvertFrom-Json
          $packageRoot = (Get-Item -LiteralPath .\dist\package\hms-agent).FullName.TrimEnd('\')
          $expectedVersion = (python -c "import hms_gpt_vps; print(hms_gpt_vps.__version__)" | Out-String).Trim()
          if ([int]$manifest.schema_version -ne 2) { throw 'Agent manifest schema mismatch' }
          if ($manifest.platform -ne 'windows-x64') { throw 'Agent manifest platform mismatch' }
          if ($manifest.entrypoint -ne 'hms-agent.exe') { throw 'Agent manifest entrypoint mismatch' }
          if ($manifest.version -ne $expectedVersion) { throw 'Agent manifest version mismatch' }

          $reparse = @(Get-ChildItem -LiteralPath $packageRoot -Recurse -Force | Where-Object {
            ($_.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0
          })
          if ($reparse.Count -ne 0) { throw 'Agent package contains a reparse point' }

          $actualFiles = @(Get-ChildItem -LiteralPath $packageRoot -Recurse -File -Force)
          if ($actualFiles.Count -ne [int]$manifest.file_count) { throw 'Agent manifest file count mismatch' }
          if (@($manifest.files).Count -ne [int]$manifest.file_count) { throw 'Agent manifest file list count mismatch' }

          [int64]$total = 0
          $seen = New-Object 'System.Collections.Generic.HashSet[string]' ([StringComparer]::OrdinalIgnoreCase)
          foreach ($entry in @($manifest.files)) {
            $relative = [string]$entry.path
            if (-not $seen.Add($relative)) { throw 'Agent manifest contains duplicate/case-colliding paths' }
            $candidate = Join-Path $packageRoot ($relative.Replace('/', '\'))
            $file = Get-Item -LiteralPath $candidate -Force -ErrorAction Stop
            if ($file.PSIsContainer) { throw 'Manifested package entry is not a file' }
            $actualRelative = $file.FullName.Substring($packageRoot.Length).TrimStart('\').Replace('\', '/')
            if ($actualRelative -cne $relative) { throw 'Agent package path casing mismatch' }
            if ([int64]$file.Length -ne [int64]$entry.size) { throw 'Agent package file size mismatch' }
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne ([string]$entry.sha256).ToLowerInvariant()) { throw 'Agent package SHA-256 mismatch' }
            $total += [int64]$file.Length
          }
          if ($total -ne [int64]$manifest.total_size) { throw 'Agent manifest total size mismatch' }
          $entrypoint = Get-Item -LiteralPath (Join-Path $packageRoot 'hms-agent.exe')
          if ($entrypoint.Length -le 0) { throw 'Agent entrypoint is empty' }
      - name: Upload attested Agent package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hms-agent-windows-x64
          path: |
            dist/package/hms-agent/**
            dist/package/hms-agent.manifest.json
          if-no-files-found: error
          retention-days: 14

  windows-native-service:
    runs-on: windows-latest
    needs: windows-package
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout authority
        shell: pwsh
        env:
          HMS_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (& git rev-parse HEAD | Out-String).Trim().ToLowerInvariant()
          $expected = ([string]$env:HMS_EXPECTED_SHA).Trim().ToLowerInvariant()
          if ($actual -ne $expected) { throw "checkout authority mismatch: actual=$actual expected=$expected" }
          $dirty = (& git status --porcelain=v1 --untracked-files=all | Out-String).Trim()
          if ($dirty) { throw 'checkout is not clean' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install qualification source runtime
        shell: pwsh
        run: python -m pip install -e .
      - name: Download exact attested Agent package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hms-agent-windows-x64
          path: package
      - name: Probe packaged Agent SCM start before cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .\scripts\probe_native_agent_service_start.py .\package
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Agent SCM start probe failed' }
      - name: Qualify packaged Agent under Windows SCM with strict evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .\scripts\qualify_native_agent_service_strict.py .\package .\native-service-proof.json
          if ($LASTEXITCODE -ne 0) { throw 'Native packaged Agent SCM qualification failed' }
          python .\scripts\verify_native_agent_service_proof.py .\native-service-proof.json
          if ($LASTEXITCODE -ne 0) { throw 'Native packaged Agent SCM proof verification failed' }
      - name: Capture raw SCM diagnostics on qualification failure
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host '--- sc.exe queryex HMSAgent ---'
          & sc.exe queryex HMSAgent
          Write-Host "queryex_exit=$LASTEXITCODE"
          Write-Host '--- sc.exe qc HMSAgent ---'
          & sc.exe qc HMSAgent
          Write-Host "qc_exit=$LASTEXITCODE"
          Write-Host '--- sc.exe qsidtype HMSAgent ---'
          & sc.exe qsidtype HMSAgent
          Write-Host "qsidtype_exit=$LASTEXITCODE"
          exit 0
      - name: Upload native SCM proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hms-agent-native-scm-proof
          path: native-service-proof.json
          if-no-files-found: error
          retention-days: 14
