name: HMSBridge Native SCM Fail-Closed

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-native-scm-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-bridge-native-scm:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout authority
        shell: pwsh
        env:
          HMS_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (& git rev-parse HEAD | Out-String).Trim().ToLowerInvariant()
          $expected = ([string]$env:HMS_EXPECTED_SHA).Trim().ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "checkout authority mismatch: actual=$actual expected=$expected"
          }
          $dirty = (& git status --porcelain=v1 --untracked-files=all | Out-String).Trim()
          if ($dirty) { throw 'checkout is not clean' }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install pinned Bridge toolchain
        shell: pwsh
        run: python -m pip install -e '.[bridge,package]'

      - name: Run native SCM proof validator tests
        shell: pwsh
        run: pytest tests/test_r002f_bridge_native_scm_failclosed.py

      - name: Build onedir Windows x64 HMSBridge
        shell: pwsh
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --console
          --name hms-bridge
          --paths src
          --collect-submodules hms_gpt_vps
          --collect-all mcp
          --collect-all uvicorn
          scripts/hms_bridge_entry.py

      - name: Attest exact HMSBridge package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path .\dist\package -Force | Out-Null
          Copy-Item -LiteralPath .\dist\hms-bridge -Destination .\dist\package\hms-bridge -Recurse
          python .\scripts\attest_bridge_package.py .\dist\package\hms-bridge .\dist\package\hms-bridge.manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'HMSBridge package attestation failed' }

      - name: Prove packaged HMSBridge fails closed after strict identity phase
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .\scripts\probe_native_bridge_service_failclosed.py .\dist\package .\native-bridge-failclosed-proof.json
          if ($LASTEXITCODE -ne 0) { throw 'Native HMSBridge SCM fail-closed proof failed' }
          $proof = Get-Content -LiteralPath .\native-bridge-failclosed-proof.json -Raw | ConvertFrom-Json
          if ($proof.win32_exit_code -ne 1066) { throw 'Bridge Win32 exit code differs from service-specific authority' }
          if ($proof.service_specific_exit_code -ne 120) { throw 'Bridge service-specific phase code differs from runtime-construction authority' }
          if (-not $proof.strict_identity_phase_passed) { throw 'Bridge strict identity phase was not proven' }
          if (-not $proof.runtime_construction_failed_closed) { throw 'Bridge runtime construction did not fail closed' }
          if (-not $proof.listener_absent_after) { throw 'Bridge listener unexpectedly existed after fail-closed probe' }
          if ($proof.tls_listener_started) { throw 'Bridge TLS listener unexpectedly started' }
          if ($proof.pairing_ready) { throw 'Bridge pairing readiness must remain false in fail-closed probe' }
          if (-not $proof.service_deleted_after_probe) { throw 'Bridge probe service cleanup was not proven' }
          if (-not $proof.temporary_package_deleted_after_probe) { throw 'Bridge probe package cleanup was not proven' }

      - name: Capture raw HMSBridge SCM diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host '--- sc.exe queryex HMSBridge ---'
          & sc.exe queryex HMSBridge
          Write-Host "queryex_exit=$LASTEXITCODE"
          Write-Host '--- sc.exe qc HMSBridge ---'
          & sc.exe qc HMSBridge
          Write-Host "qc_exit=$LASTEXITCODE"
          Write-Host '--- sc.exe qsidtype HMSBridge ---'
          & sc.exe qsidtype HMSBridge
          Write-Host "qsidtype_exit=$LASTEXITCODE"
          exit 0

      - name: Upload native HMSBridge fail-closed proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hms-bridge-native-scm-failclosed-proof
          path: native-bridge-failclosed-proof.json
          if-no-files-found: error
          retention-days: 14
