name: HMSBridge Windows Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-package-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-bridge-package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout authority
        shell: pwsh
        env:
          HMS_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (& git rev-parse HEAD | Out-String).Trim().ToLowerInvariant()
          $expected = ([string]$env:HMS_EXPECTED_SHA).Trim().ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "checkout authority mismatch: actual=$actual expected=$expected"
          }
          $dirty = (& git status --porcelain=v1 --untracked-files=all | Out-String).Trim()
          if ($dirty) { throw 'checkout is not clean' }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install pinned Bridge package toolchain
        shell: pwsh
        run: python -m pip install -e '.[bridge,package]'

      - name: Run Bridge package authority tests
        shell: pwsh
        run: pytest tests/test_r002f_bridge_package.py

      - name: Build onedir Windows x64 HMSBridge
        shell: pwsh
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --console
          --name hms-bridge
          --paths src
          --collect-submodules hms_gpt_vps
          --collect-all mcp
          --collect-all uvicorn
          scripts/hms_bridge_entry.py

      - name: Smoke packaged HMSBridge version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (& .\dist\hms-bridge\hms-bridge.exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Packaged hms-bridge.exe --version failed' }
          $expected = (python -c "import hms_gpt_vps; print('hms-bridge ' + hms_gpt_vps.__version__)" | Out-String).Trim()
          if ($actual -ne $expected) {
            throw "Packaged Bridge version mismatch: actual=$actual expected=$expected"
          }

      - name: Attest complete HMSBridge onedir package tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path .\dist\package -Force | Out-Null
          Copy-Item -LiteralPath .\dist\hms-bridge -Destination .\dist\package\hms-bridge -Recurse
          python .\scripts\attest_bridge_package.py .\dist\package\hms-bridge .\dist\package\hms-bridge.manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'HMSBridge onedir package attestation failed' }

          $manifest = Get-Content -LiteralPath .\dist\package\hms-bridge.manifest.json -Raw | ConvertFrom-Json
          $expectedVersion = (python -c "import hms_gpt_vps; print(hms_gpt_vps.__version__)" | Out-String).Trim()
          if ([int]$manifest.schema_version -ne 2) { throw 'Bridge manifest schema mismatch' }
          if ($manifest.platform -ne 'windows-x64') { throw 'Bridge manifest platform mismatch' }
          if ($manifest.entrypoint -ne 'hms-bridge.exe') { throw 'Bridge manifest entrypoint mismatch' }
          if ($manifest.version -ne $expectedVersion) { throw 'Bridge manifest version mismatch' }
          if ([int]$manifest.file_count -le 0) { throw 'Bridge manifest file_count is invalid' }
          if ([int64]$manifest.total_size -le 0) { throw 'Bridge manifest total_size is invalid' }

      - name: Upload attested HMSBridge package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hms-bridge-windows-x64
          path: |
            dist/package/hms-bridge/**
            dist/package/hms-bridge.manifest.json
          if-no-files-found: error
          retention-days: 14
