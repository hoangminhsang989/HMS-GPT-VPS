[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hms-gpt-vps"
version = "0.1.0"
description = "Secure VPS agent foundation for HMS GPT control workflows"
requires-python = ">=3.11"
dependencies = [
  "pycdlib>=1.20,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
