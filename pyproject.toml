[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hms-gpt-vps"
version = "0.1.0"
description = "Secure VPS agent foundation for HMS GPT control workflows"
requires-python = ">=3.11"
dependencies = [
  "pycdlib>=1.20,<2",
]

[project.scripts]
hms-agent = "hms_gpt_vps.cli:main"
hms-bridge = "hms_gpt_vps.bridge_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "mcp>=2,<3",
]
bridge = [
  "mcp>=2,<3",
  "uvicorn>=0.30,<1",
]
package = [
  "pyinstaller==6.22.2",
  "pyinstaller-hooks-contrib==2026.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
